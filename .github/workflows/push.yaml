name: Push
on: 
  schedule:
    # 每天北京时间6点运行 (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: PARATRANZ_ENV
    env:
      PARATRANZ_TOKEN: ${{ secrets.KEY }}
      PROJECT_ID: ${{ vars.ID }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: make app executable
        run: chmod +x ./supersymmetry-chinese
      - name: push
        run: ./supersymmetry-chinese push
