name: Pull
on: 
  schedule:
    # 每天北京时间早晚10点左右自动运行
    - cron: "0 1,13 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: PARATRANZ_ENV
    env:
      PARATRANZ_TOKEN: ${{ secrets.KEY }}
      PROJECT_ID: ${{ vars.ID }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: make app executable
        run: chmod +x ./supersymmetry-chinese
      - name: pull
        run: ./supersymmetry-chinese pull
      - name: commit changes and push
        uses: EndBug/add-and-commit@v9
        with:
          message: "CI: pull"
          default_author: github_actions